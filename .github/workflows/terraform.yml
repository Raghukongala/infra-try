name: Terraform CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: 1.5.7
  AWS_REGION: ap-south-1

jobs:
  validate:
    name: Validate ${{ matrix.root }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - .
          - organization
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate

  plan:
    name: Plan ${{ matrix.environment }}
    needs: validate
    # Skip on fork PRs, where OIDC / secrets are unavailable
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for AWS OIDC
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, uat, prd]
    # Per-environment approvals/secrets can be attached via GitHub Environments
    environment: ${{ matrix.environment }}
    concurrency:
      group: tf-plan-${{ matrix.environment }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Terraform plan (${{ matrix.environment }})
        id: plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file=${{ matrix.environment }}.tfvars \
            -out=tfplan-${{ matrix.environment }} \
            | tee plan-${{ matrix.environment }}.txt

      - name: Add plan to job summary
        if: always()
        run: |
          {
            echo "### Terraform plan: ${{ matrix.environment }}"
            echo '```'
            tail -n 60 plan-${{ matrix.environment }}.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: |
            tfplan-${{ matrix.environment }}
            plan-${{ matrix.environment }}.txt
          retention-days: 7
