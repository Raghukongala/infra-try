name: Destroy Existing Resources

# Terminates EC2 instances created by this Terraform project, found by tag
# (Project=modules-new + Environment=<env>). Works even when Terraform state is lost.
#
# - On every push (any branch): destroys ALL environments, no confirmation.
# - Manual run: choose environment, dry run and confirmation.
# REMOVE the "push:" line after the cleanup so it doesn't run again.

on:
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        type: choice
        required: true
        default: dev
        options:
          - dev
          - uat
          - prd
          - all
      dry_run:
        description: Only list what would be terminated (no deletion)
        type: boolean
        required: true
        default: true
      confirm:
        description: 'For a real run type "destroy-<environment>" (e.g. destroy-dev or destroy-all)'
        type: string
        required: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  PROJECT_TAG: modules-new

jobs:
  destroy:
    name: Destroy ${{ inputs.environment || 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation (manual real runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        env:
          TARGET_ENV: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy-$TARGET_ENV" ]; then
            echo "Confirmation does not match 'destroy-$TARGET_ENV'. Aborting."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find instances
        id: find
        env:
          TARGET_ENV: ${{ inputs.environment || 'all' }}
        run: |
          if [ "$TARGET_ENV" = "all" ]; then
            ENVS="dev,uat,prd"
          else
            ENVS="$TARGET_ENV"
          fi

          IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=$PROJECT_TAG" \
                      "Name=tag:Environment,Values=$ENVS" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          {
            echo "### Instances matching Project=$PROJECT_TAG, Environment=$ENVS (region $AWS_REGION)"
            echo '```'
            aws ec2 describe-instances \
              --filters "Name=tag:Project,Values=$PROJECT_TAG" \
                        "Name=tag:Environment,Values=$ENVS" \
                        "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              --query "Reservations[].Instances[].[InstanceId,InstanceType,State.Name,Tags[?Key=='Name']|[0].Value]" \
              --output table
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      - name: Terminate instances
        if: ${{ !inputs.dry_run && steps.find.outputs.ids != '' }}
        env:
          IDS: ${{ steps.find.outputs.ids }}
        run: |
          aws ec2 terminate-instances --instance-ids $IDS
          aws ec2 wait instance-terminated --instance-ids $IDS
          echo "Terminated: $IDS"

      - name: Nothing to do
        if: ${{ steps.find.outputs.ids == '' }}
        run: echo "No matching instances found."
