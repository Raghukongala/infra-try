name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        type: choice
        required: true
        options:
          - dev
          - uat
          - prd
      confirm:
        description: 'Type "destroy-<environment>" to confirm (e.g. destroy-dev)'
        type: string
        required: true

permissions:
  contents: read

env:
  TF_VERSION: 1.5.7
  AWS_REGION: ap-south-1

jobs:
  destroy:
    name: Destroy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Add required reviewers on the GitHub Environment for an approval gate
    environment: ${{ inputs.environment }}
    # Share the lock group with apply so the two never run at the same time
    concurrency:
      group: tf-apply-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Verify confirmation
        env:
          TARGET_ENV: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy-$TARGET_ENV" ]; then
            echo "Confirmation text does not match 'destroy-$TARGET_ENV'. Aborting."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Plan destroy (${{ inputs.environment }})
        shell: bash
        run: |
          terraform plan -destroy \
            -input=false \
            -no-color \
            -var-file=${{ inputs.environment }}.tfvars \
            -out=tfdestroy-${{ inputs.environment }} \
            | tee destroy-plan.txt

      - name: Add destroy plan to job summary
        if: always()
        run: |
          {
            echo "### Terraform destroy plan: ${{ inputs.environment }}"
            echo '```'
            tail -n 60 destroy-plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform destroy (${{ inputs.environment }})
        run: terraform apply -input=false -no-color tfdestroy-${{ inputs.environment }}
